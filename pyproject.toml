[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hgst-engine"
version = "1.0.0"
description = "Sovereign High-Dimensional Cellular Sheaf Cohomology & Governance Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "RCFabrications", email = "dev@rcfabrications.com"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
hgst-cli = "hgst.governance_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hgst*"]
