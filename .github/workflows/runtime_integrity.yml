name: Runtime Integrity

on:
  pull_request:
  push:
    branches: [main, fix/hgst-runtime-integrity]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package
        run: pip install -e .
      - name: Run Python verification
        run: python -m unittest discover -s tests -v
      - name: Check native source syntax
        run: make -C hgst check-abi
